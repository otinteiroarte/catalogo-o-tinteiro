      a.botao {

        font-family: 'IM Fell English SC', Georgia, serif; letter-spacing: 0.08em; font-size: 0.95rem; text-decoration: none;
      }
      .ouro { background: var(--ouro); color: var(--musgo); }
      .linha { border: 1px solid rgb(196 164 108 / 0.55); color: var(--pergaminho); }
      a.botao:focus-visible { outline: 2px solid var(--ouro-claro); outline-offset: 3px; }
      @media (hover: hover) { .ouro:hover { background: var(--ouro-claro); } .linha:hover { border-color: var(--ouro); } }
